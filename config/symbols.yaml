#   - `./qdmcli -instrument action=list` run from /home/jack/QDM, filtered to the
#     "*_dukascopy" rows (logs/instrument_list_dukascopy_only.log) — this is QDM's
#     definitive list of what Dukascopy actually offers, so every mapping below was
#     verified against real output, not guessed.
#
# Naming convention: the `dukascopy_name` below is the QDM *symbol* name (what you
# pass to `-symbol action=add symbols=<name> datasource=dukascopy`). QDM internally
# stores the paired *instrument* as `<dukascopy_name>_dukascopy` (see
# `-instrument action=list` output) — do not include the `_dukascopy` suffix when
# calling `-symbol action=add`.
#
# Summary:
#   Total FTMO symbols:      49
#   Mapped to Dukascopy:      49
#   No Dukascopy match:        0
#
# Asset class breakdown:
#   forex:      42
#   index:       3  (US100, US500, US30)
#   metal:       2  (XAGUSD, XAUUSD)
#   commodity:   1  (USOIL)
#   crypto:      1  (BTCUSD)
#
# Notable non-1:1 remaps (verified against instrument list, not assumed):
#   US100  -> USATECHIDXUSD  (Dukascopy's USA tech-100 index)
#   US500  -> USA500IDXUSD
#   US30   -> USA30IDXUSD
#   USOIL  -> LIGHTCMDUSD    (WTI/"light" crude; Dukascopy also separately offers
#                             BRENT.CMD/BRENTCMDUSD, which corresponds to broker
#                             "UKOIL", so this was chosen deliberately, not by default)
#   All FX majors/minors/exotics (incl. USDCNH, USDHUF, USDCZK, EURNOK, USDZAR,
#   USDSGD, USDPLN, USDNOK, USDMXN, EURCZK, EURHUF, EURPLN, EURSEK) mapped 1:1 —
#   Dukascopy carries every FTMO FX pair with no substitution needed.
#   XAUUSD/XAGUSD -> direct match (Dukascopy category "FX_Commodities").
#   BTCUSD -> direct match (Dukascopy category "FX_Crypto Currency").
#
# GOTCHA (2026-07-18, discovered the hard way — read this before touching the
# 4 index/commodity mappings above): QDM's `-instrument action=list` DISPLAYS
# these 4 instruments with a dotted name (USATECH.IDX, USA500.IDX, USA30.IDX,
# LIGHT.CMD) — that dotted form is QDM's own internal/normalized display name,
# NOT Dukascopy's actual raw datafeed symbol code. `-symbol action=add`
# silently no-ops for any symbol name containing a literal "." on qdmcli
# build 125.2692: it prints "Add symbols." / "Exit app - ok" (looks like
# success) but the symbol never actually appears in a subsequent
# `-symbol action=list` and any later `exportToMT5` fails with "Symbol ...
# doesn't exist." Four different workarounds were tried (explicit
# `instrument=` arg, pre-creating the instrument via `-instrument
# action=add`, backslash-escaping the dot, quoting) — all failed identically.
# The FIX: Dukascopy's real raw-feed codes for these 4 are dot-free and
# currency-suffixed - USATECHIDXUSD, USA500IDXUSD, USA30IDXUSD, LIGHTCMDUSD
# (this matches the very first Part-A task brief's hint, which turned out to
# be Dukascopy's actual code, not QDM's display name). These dot-free codes
# WORK in `-symbol action=add` and were independently verified by fetching
# real ticks directly from datafeed.dukascopy.com (bypassing QDM entirely)
# before ever touching qdmcli with them — sane, correctly-scaled prices for
# 2026 (US100 ~29241, US500 ~7567, US30 ~52808, USOIL ~$79.56). If a future
# session needs to touch Group B again: use the dot-free code below, never
# the dotted display name from `-instrument action=list`.

