#   metal:       2  (XAGUSD, XAUUSD)
#   commodity:   1  (USOIL)
#   crypto:      1  (BTCUSD)
#
# Notable non-1:1 remaps (verified against instrument list, not assumed):
#   US100  -> USATECH.IDX   (Dukascopy's USA tech-100 index; category "USA_Indexes")
#   US500  -> USA500.IDX    (category "USA_Indexes")
#   US30   -> USA30.IDX     (category "USA_Indexes")
#   USOIL  -> LIGHT.CMD     (WTI/"light" crude; Dukascopy also separately offers
#                            BRENT.CMD which corresponds to broker "UKOIL", so
